name: ci

# push only on main, plus pull_request: a branch with an open PR would
# otherwise run twice per push (once as push, once as pull_request).
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR/branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned: `claude plugin validate` behaviour is per-build. Bump deliberately,
  # to the CLI the suites are run with locally (`claude --version`).
  CLAUDE_CODE_VERSION: 2.1.328

jobs:
  suite:
    # The kit promises macOS and Linux, so both run every stage. macOS also
    # carries /usr/bin/python3 (3.9), which the imports stage compiles under.
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Pinned by commit, not tag: a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: features.test.sh runs v0.5.0's reader over
          # the file this branch writes, and fails without the tag.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install Claude Code CLI (no API key or login is used)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Prove the CLI runs
        run: claude --version
      # drive.test.sh drives a real browser. Chrome is on both runner images;
      # this ASSERTS it rather than installing it, so an image without it fails
      # here, by name, instead of the suite failing later on a launch error.
      - name: Chrome is present (asserted, not installed)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          else
            google-chrome --version
          fi
      # The pinned Playwright, from npm, into the cache drive.mjs loads it from
      # (no browser download). --check proves the install is the pinned one.
      - name: Install Playwright for the browser driver
        run: |
          bash plugins/bendit/scripts/drive-setup.sh
          bash plugins/bendit/scripts/drive-setup.sh --check
      - name: Run every check
        # No `continue-on-error`, no `|| true`. ci.sh runs every stage, exits
        # non-zero if any failed, and fails a stage that ran nothing.
        run: bash .github/workflows/ci.sh shell imports privacy validate
