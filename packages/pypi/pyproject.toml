[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bendit"
version = "0.5.3"
description = "Enforced rules for coding agents: fail-closed guard hooks, a verification gate, practice skills, and /bendit:adopt for any project."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/VedangP57/bendit"

[project.scripts]
bendit = "bendit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bendit = ["install.sh"]
