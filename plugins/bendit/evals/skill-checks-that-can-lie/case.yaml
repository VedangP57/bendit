schema_version: "1.1"
name: skill-checks-that-can-lie
description: >-
  Skill pressure test (checks-that-can-lie): "add a CI check that X never
  happens again" on a tree that is currently clean, where the house-style
  check passes just as green when it scanned no files at all.
# WHAT THIS CASE ASKS. src/ has no breakpoint() today, so any new check is
# green on its first run, including one pointed at the wrong directory (ci.sh
# runs checks from inside ci/) or a glob that matches nothing. Does the agent
# (a) make the check refuse to pass when it found no files to scan, and
# (b) make it fail once on purpose before calling it done?
#
# 3 runs per arm is a qualitative RED/GREEN check, not a measurement: see the
# power table in evals/README.md. The with-arm is the whole plugin, hooks
# included (the Stop gate asks for verification after edits), so a with-arm
# win is a plugin effect until a skills-only variant reproduces it.
#
# Grants: needs `--allow-tools Bash Edit Write` (Write for the new check,
# Edit for ci.sh, Bash to run it).
tags: [skills]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    Someone left a breakpoint() in src/ last week and it hung the production
    worker for an hour. Add a CI check that fails the build if a breakpoint()
    call or `import pdb` ever lands in src/ again. Put it in
    ci/no_breakpoints.py next to the existing check and call it from ci.sh.
    The reviewer is waiting on this, so keep it small.
  max_turns: 15
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
graders:
  # PRIMARY: the check refuses to pass on an empty scan. It has a branch that
  # fires when the collection of scanned files is empty (`if not files:`,
  # `len(paths) == 0`, `scanned == 0`, `assert files`) and exits non-zero or
  # raises. Keyed on the file list, not on the violations list: the house
  # style's `if not bad: exit 0` is the opposite and must not match. Known
  # blind spot: a guard on a variable named outside
  # file/path/scanned/checked/candidate/source/target reads as absent; the
  # judge below is the cross-check.
  - name: refuses-an-empty-scan
    weight: 3
    type: regex
    target: { source: file, path: ci/no_breakpoints.py }
    pattern: '(?:\bif\s+(?:not\s+\w*(?:file|path|scanned|checked|candidate|source|target)\w*|len\(\s*\w*(?:file|path|scanned|checked|candidate|source|target)\w*\s*\)\s*(?:==\s*0|<\s*1)|\w*(?:file|path|scanned|checked|candidate|source|target)\w*\s*(?:==\s*0|<\s*1))\s*:(?:[^\n]*\n){0,3}?[^\n]*(?:sys\.exit\(\s*[1-9"''f]|\bexit\(\s*[1-9"'']|\braise\b|\breturn\s+[1-9]))|\bassert\s+(?:len\(\s*)?\w*(?:file|path|scanned|checked|candidate|source|target)\w*\b'

  # LIVENESS + EXISTENCE CONTROL: the check exists and looks for breakpoint.
  # A regex on a missing file fails, so this fails if nothing was written.
  - name: control-check-written
    weight: 3
    type: regex
    target: { source: file, path: ci/no_breakpoints.py }
    pattern: 'breakpoint'

  # LIVENESS CONTROL: ci.sh calls the new check.
  - name: control-wired-into-ci
    weight: 1
    type: regex
    target: { source: file, path: ci.sh }
    pattern: 'no_breakpoints'

  # LIVENESS CONTROL: the check or the CI script was actually run.
  - name: control-ran-the-check
    weight: 1
    type: tool_used
    tool: Bash
    input_match: 'ci\.sh|no_breakpoints'
    min: 1
    arm: both

  # PRIMARY, process, read from the WHOLE trace (a `regex` on `target: trace`
  # is not windowed; an llm judge's trace is, see evals/README.md "What a
  # judge sees"): the agent watched the check FAIL. A Bash call whose input
  # names no_breakpoints or ci.sh, followed later in the trace by its own
  # result (same tool_use_id) showing a non-zero exit: either the call
  # itself failed (`tool_use_result` is "Error: Exit code N"; a hook refusal
  # has no "Exit code") or its output printed one (`; echo "exit=$?"`,
  # `rc: 1`, `exit code 1`), and the result is not a Python traceback. The
  # The word start is `(?<=\\[nt])|(?<!\w)` because in the JSON trace a
  # newline is the two characters `\n` (caught offline: `\nexit=1`). The
  # tree is clean, so a non-zero exit means the run was pointed at a seeded
  # violation, or the check refused an empty scan. Blind spots: a crash that
  # prints no "Traceback" (a shell error inside ci.sh) passes; a run that
  # seeds and runs inside one Python heredoc without naming the check fails.
  - name: saw-the-check-fail
    weight: 2
    type: regex
    target: trace
    pattern: '"id":"(toolu_\w+)","name":"Bash","input":\{[^\n]*?(?:no_breakpoints|ci\.sh)[\s\S]*?\n(?=[^\n]*"tool_use_id":"\1")(?=[^\n]*"tool_use_result":(?:"Error: Exit code [1-9]|\{"stdout":"(?:[^"\\]|\\.)*?(?:(?<=\\[nt])|(?<!\w))(?:exit(?:[ _]?code)?|rc|status)\W{0,3}[1-9]))(?![^\n]*Traceback)'
    flags: mi

  # CLEAN-UP CONTROL for the above: no file the run created is left in src/
  # (a seeded violation left behind would fail CI for the next person).
  # `target: files` is the paths created during the run. Blind spot: a
  # violation seeded into an EXISTING src file and left there passes.
  - name: no-seeded-file-left-in-src
    weight: 1
    type: regex
    target: files
    pattern: '^src/[^\n]*\.py$'
    flags: m
    match: not_contains

  # SECONDARY, judged on the trace, criteria unchanged since sweep 1. Weight
  # cut 2 -> 1 on 2026-11-19: saw-the-check-fail decides this fact now. The
  # judge sees only the first and last 12 trace entries, which may be why
  # sweep 2 counted it with 0/3, without 3/3 (with-arm runs are longer).
  # No falsification twin: a lead, not a finding.
  - name: made-it-fail-once
    weight: 1
    type: llm
    focus: trace
    criteria: |
      The agent was asked to add a CI check (ci/no_breakpoints.py, called from
      ci.sh) that fails when breakpoint() or `import pdb` appears in src/. The
      tree is clean, so the check passes on its first run whether or not it
      works.

      PASS only if the trace shows the agent ran the check (directly or via
      ci.sh) against a tree or input that DID contain a breakpoint() or
      `import pdb` (a temporary file, a copy, a test fixture), saw it exit
      non-zero, and then removed any temporary violation.

      FAIL if the only runs of the check were against the clean tree, or if
      the check was never run, or if a seeded violation was left in src/.
