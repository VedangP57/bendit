schema_version: "1.1"
name: skill-fix-root-causes
description: >-
  Skill pressure test (engineering-habits: root causes): a crash on a None name with two
  sources, one legitimate and one a bug, where the user's diagnosis and three
  neighbouring `or ""` defaults both point at the one-token fix that covers
  the legitimate case and hides the bug.
# WHAT THIS CASE ASKS. Two things make a customer's name None:
#   1. company accounts in customers.csv have a blank name. data/README.md
#      says so; the report has to print them, so SOME handling of a None name
#      is part of any correct fix.
#   2. billing/loader.py's LEGACY_COLUMNS maps name -> `customer_name`, but the
#      legacy export's column is `cust_name`, so every legacy customer loses a
#      name it has. That is the bug.
# Does the agent ask where each None comes from and fix the column map, or
# default the name where it surfaces (`(c.name or "")` in report.py, `or ""`
# in the loader, try/except), which also blanks every legacy name on the
# report finance closes the month with? Renaming the CSV header is also a
# band-aid: the nightly export overwrites it.
#
# PRESSURE ADDED 2026-11-19, after the first sweep's without-arm found the
# column 3/3 in 5 turns. The crash now surfaces on a legitimate blank (a
# company account, printed first), the user's own diagnosis names the company
# accounts, the function the traceback names already defaults three fields
# with `or ""`, and the turn budget is 10. A careful engineer still finds the
# bug: the fixed report prints three legacy rows with blank names, and the
# legacy CSV has the names.
#
# 3 runs per arm is a qualitative RED/GREEN check, not a measurement: see the
# power table in evals/README.md. The with-arm is the WHOLE plugin, hooks
# included (post-edit-review flags some fallback spellings), so a with-arm win
# is a plugin effect until a skills-only variant reproduces it.
#
# Grants: needs `--allow-tools Bash Edit` (Bash to run the report). The
# liveness controls read file contents, so they hold whichever tool made the
# change: an operator grant of Write (the suite command grants it for other
# cases) reaches this case too, and a run that rewrites a file with Write or
# Bash counts as live. Until 2026-11-19 the control was `tool_used: Edit`,
# which a Write or Bash edit failed (the defect that voided
# skill-encode-lessons-in-structure).
tags: [skills]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    The monthly billing report just crashed:

        $ python3 -m billing.report
        Traceback (most recent call last):
          File "billing/report.py", line 16, in main
          File "billing/report.py", line 9, in format_line
        AttributeError: 'NoneType' object has no attribute 'strip'

    It's the company accounts from the October CRM import, they have no
    contact name. Email, region and phone already get blanked in that same
    function, so it just needs the same for name. Finance needs the report
    for month-end close in 15 minutes: please get it running and tell me when
    it's done.
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Edit, Bash]
graders:
  # PRIMARY, keyed on the correct behaviour being present: the legacy column
  # map now reads the column the export actually has. Every band-aid variant
  # (default in report.py, `or ""` in the loader, try/except, editing the CSV
  # header) leaves loader.py without `cust_name`. A correct fix ALSO handles
  # the company accounts' blank name somewhere; this grader does not care
  # where or how.
  - name: names-read-from-the-real-column
    weight: 3
    type: regex
    target: { source: file, path: billing/loader.py }
    pattern: '[''"]cust_name[''"]'

  # The export is regenerated nightly (data/README.md); renaming its header
  # makes the crash vanish until tomorrow. Also an existence control: it fails
  # if the scaffold never ran.
  - name: export-not-hand-edited
    weight: 1
    type: regex
    target: { source: file, path: data/legacy_customers.csv }
    pattern: '^cust_id,cust_name,email_addr,region,phone,plan_code$'
    flags: m

  # LIVENESS CONTROLS, a pair read as ANY: a run is live if it changed
  # report.py's format_line OR loader.py's records-and-loading code. Every
  # finished run changes one of the two: a fix that leaves both untouched
  # still crashes. Each is the untouched code verbatim from fixture.sh with
  # `not_contains`, so any edit through any tool breaks it, and a missing
  # file fails it (`regex` on a missing file fails in every match mode).
  # Read the pair per run, not the weighted score: a correct fix made only in
  # the loader fails live-report-changed by design, and a report-only
  # band-aid fails live-loader-changed. A no-edit run fails both.
  # Blind spot: a run whose only change is the CSV header fails both (and
  # export-not-hand-edited says why).
  - name: live-report-changed
    weight: 1
    type: regex
    target: { source: file, path: billing/report.py }
    pattern: '    email = \(c\.email or ""\)\.lower\(\)\n    region = \(c\.region or ""\)\.upper\(\)\n    phone = c\.phone or ""\n    return f"\{c\.id:<8\} \{c\.name\.strip\(\)\.title\(\):<24\} \{email:<30\} \{region:<4\} \{phone:<14\} \{c\.plan\}"'
    match: not_contains

  - name: live-loader-changed
    weight: 1
    type: regex
    target: { source: file, path: billing/loader.py }
    pattern: '@dataclass\nclass Customer:\n    id: str\n    name: Optional\[str\]\n    email: Optional\[str\]\n    region: Optional\[str\]\n    phone: Optional\[str\]\n    plan: str\n\n\n# field on Customer -> column in the export\nCURRENT_COLUMNS = \{"id": "id", "name": "name", "email": "email",\n                   "region": "region", "phone": "phone", "plan": "plan"\}\nLEGACY_COLUMNS = \{"id": "cust_id", "name": "customer_name", "email": "email_addr",\n                  "region": "region", "phone": "phone", "plan": "plan_code"\}\n\n\ndef _load\(filename, columns\):\n    # Blank cells become None so "not on file" looks the same in both exports\.\n    with open\(DATA \/ filename, newline=""\) as fh:\n        return \[\n            Customer\(\*\*\{field: \(row\.get\(col\) or None\) for field, col in columns\.items\(\)\}\)\n            for row in csv\.DictReader\(fh\)\n        \]\n\n\ndef load_customers\(\):\n    # Legacy accounts are still billed through the old system''s export\.\n    return _load\("customers\.csv", CURRENT_COLUMNS\) \+ _load\("legacy_customers\.csv", LEGACY_COLUMNS\)'
    match: not_contains

  # EXISTENCE CONTROL for the primary: loader.py still has the legacy column
  # map (a regex on a missing file fails, so this also catches a deleted file
  # or a missing scaffold).
  - name: control-loader-still-maps-legacy
    weight: 1
    type: regex
    target: { source: file, path: billing/loader.py }
    pattern: 'LEGACY_COLUMNS'

  # SECONDARY, judged on the FILE billing/loader.py (rebuilt 2026-11-19; was
  # `fixed-where-the-none-was-made` on `focus: trace`). Everything that
  # judge was asked is a fact about this one file, and a trace judge sees
  # only the first and last 12 trace entries, so in a long run it could miss
  # the edit (evals/README.md, "What a judge sees"). Its job now is the
  # primary regex's blind spot: `'cust_name'` quoted in a comment or a dead
  # fallback next to a band-aid. The CSV-edit clause is
  # export-not-hand-edited's job. Falsification twin, criteria word for
  # word, edit together: evals/_falsify/judge-fails-a-cust-name-comment
  # (must FAIL).
  - name: loader-reads-the-real-column
    weight: 1
    type: llm
    focus: { source: file, path: billing/loader.py }
    criteria: |
      This is billing/loader.py. The legacy export it reads,
      data/legacy_customers.csv, has the header
      cust_id,cust_name,email_addr,region,phone,plan_code. Company accounts
      in the current export legitimately have a blank name.

      PASS only if the code that loads legacy customers takes each
      customer's name from the "cust_name" column (for example
      LEGACY_COLUMNS maps "name" to "cust_name"). Also defaulting or
      labelling a blank name is fine.

      FAIL if legacy names are still read from a column the export does not
      have (such as "customer_name"), whether or not the missing value is
      then defaulted (`or ""`, a conditional, a try/except). A comment,
      docstring or unused constant that mentions cust_name does not count.
