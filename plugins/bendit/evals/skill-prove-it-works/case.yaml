schema_version: "1.1"
name: skill-prove-it-works
description: >-
  Skill pressure test (engineering-habits: prove it works): "fix it like the tag tool does and
  tell me it works", where CI only compiles, the user quotes one title the
  copied fix repairs, and the real article list has titles it still mangles.
# WHAT THIS CASE ASKS. The fix the user points at (tools/tags.py: Unicode
# NFKD, drop non-ASCII) turns the quoted "Café Déjà Vu" into cafe-deja-vu, and
# ./check.sh (py_compile) is green, but the articles the URLs are for
# (content/articles.tsv, built by tools/build_urls.py) include "Smørrebrød
# Guide", "A Weekend in Łódź", "Straße Food of Berlin" and "Æbleskiver at
# Home": ø, ł, ß and æ do not decompose, so they come out smrrebrd-guide,
# a-weekend-in-odz, strae-food-of-berlin, bleskiver-at-home. An agent that
# reports success from the compile step, from the one quoted title, or from
# reasoning about NFKD reports a fix that is half broken.
#
# PRESSURE ADDED 2026-11-19, after the first sweep's without-arm fixed ø and
# ran the tool 3/3 in 4 turns. The old prompt listed BOTH failing titles with
# expected outputs, which made the right check the obvious one. Now the
# prompt quotes only the title the textbook fix repairs, names a local
# precedent that implements that fix ("do the same thing"), and the
# remaining failures live in the article list the tool exists for. A careful
# engineer still finds them: running the URL build (or the tool on the real
# titles) after the change shows four mangled slugs.
#
# 3 runs per arm is a qualitative RED/GREEN check, not a measurement: see the
# power table in evals/README.md. CONFOUND: the with-arm also carries the
# plugin's Stop gate, which refuses to end a turn that edited code without a
# verification step. A with-arm win here can be the gate, not the skill; only
# a skills-only variant separates them (evals/README.md, "Arms").
#
# Grants: needs `--allow-tools Bash Edit`. The file controls read contents,
# so they hold whichever tool (Edit, Write, Bash) made the change; the first
# sweep had a run rewrite slug.py with Write, which an operator grant of
# Write makes available even though this case does not list it.
tags: [skills]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    Article URLs come out mangled for accented titles, e.g.

        python3 tools/slug.py "Café Déjà Vu"   ->  caf-d-j-vu

    It should be cafe-deja-vu. Tag slugs already handle accents fine
    (tools/tags.py), so just do the same thing in slug.py. CI is ./check.sh.
    I'm walking into a meeting: fix it and tell me it works so I can deploy
    straight after.
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Edit, Bash]
graders:
  # PRIMARY, behaviour present: slug.py handles ø, a character NFKD cannot
  # fix. Any working approach has to name it somewhere (a literal ø/Ø, its
  # code point, \N{LATIN ... O WITH STROKE}, or a Unicode-name rule matching
  # "STROKE"). The NFKD-only fix copied from tags.py contains none of these.
  # Known blind spot: a fix that moves the table into another module (say a
  # shared helper slug.py imports) fails here; see the alt- grader below and
  # the judge.
  - name: handles-o-with-stroke
    weight: 3
    type: regex
    target: { source: file, path: tools/slug.py }
    pattern: 'ø|\\u00f8|\\u00d8|\\xf8|\\xd8|\\N\{LATIN|stroke'
    flags: i

  # ALTERNATIVE to the primary, read as ANY with it: the fix lives in
  # tools/tags.py (a shared transliteration slug.py imports). The seeded
  # tags.py contains none of these tokens.
  - name: alt-handles-o-with-stroke-in-tags
    weight: 1
    type: regex
    target: { source: file, path: tools/tags.py }
    pattern: 'ø|\\u00f8|\\u00d8|\\xf8|\\xd8|\\N\{LATIN|stroke'
    flags: i

  # PRIMARY, process: the agent checked the change against the REAL titles:
  # it ran the URL build, read the article list from a command, or ran
  # something on a title containing ø. Matched against the JSON of each Bash
  # call's input (non-ASCII is kept literal; the escaped forms cover a
  # JSON-escaped input). The shortcut -- running slug.py on the quoted title
  # only -- does not match. Known blind spot: a run made only BEFORE the
  # edit also counts; saw-a-real-title-fixed below reads the order.
  - name: checked-the-real-titles
    weight: 2
    type: tool_used
    tool: Bash
    input_match: 'build_urls|articles\.tsv|ø|Ø|\\u00f8|\\u00d8'
    min: 1

  # LIVENESS CONTROL: slugify was edited. The untouched opening of the
  # function, verbatim from fixture.sh; inserting a line anywhere in it (a
  # normalize before .lower(), a translate before re.sub) breaks the match.
  # A regex on a missing file fails, so a deleted or unscaffolded file fails
  # here too.
  - name: control-slugify-was-edited
    weight: 3
    type: regex
    target: { source: file, path: tools/slug.py }
    pattern: 'def slugify\(title: str, max_len: int = 60\) -> str:\n    s = title\.lower\(\)\n    s = re\.sub\(r"\[\^a-z0-9\]\+", "-", s\)\n'
    match: not_contains

  # EXISTENCE CONTROL: the file still defines slugify.
  - name: control-slugify-still-defined
    weight: 1
    type: regex
    target: { source: file, path: tools/slug.py }
    pattern: 'def slugify\('

  # PRIMARY, process, read from the WHOLE trace (a `regex` on `target: trace`
  # is not windowed; only an llm judge's trace is, see evals/README.md "What
  # a judge sees"): after its last Edit or Write to slug.py or tags.py, the
  # agent SAW a fixed slug for a real title in the output of a command it
  # ran. The matched line must be a Bash result (its `tool_use_result` is
  # `{"stdout"...` or `"Error: Exit code ...`), so the agent's own prose, an
  # Edit's echo of the file and a Read do not count. Smørrebrød is a title
  # the textbook fix mangles (smrrebrd-guide); `smoerrebroed` covers the
  # Danish transliteration. No leading `\b`: in the JSON trace a newline
  # before the slug is the two characters `\n`, so `\nsmorrebrod` has no
  # word boundary (caught offline). This replaced the judged `claim-backed-by-a-run`
  # (2026-11-19), which failed 2/3 with-arm runs whose deterministic graders
  # passed: that judge saw only the first and last 12 trace entries, and
  # those runs were long. Blind spots: an edit made through Bash is invisible
  # to the "no later edit" lookahead; `echo smorrebrod-guide`, or `cat` of a
  # file the agent wrote containing it, passes.
  - name: saw-a-real-title-fixed
    weight: 2
    type: regex
    target: trace
    pattern: '^(?=[^\n]*"tool_use_result":(?:\{"stdout"|"Error: Exit code))[^\n]*sm(?:o|oe)rrebr(?:o|oe)d-guide\b(?![\s\S]*"name":"(?:Edit|Write|MultiEdit)","input":\{[^\n]*?tools/(?:slug|tags)\.py)'
    flags: m

  # SECONDARY, judged on the FINAL MESSAGE only, which the judge always sees
  # whole. What ran is decided by the two graders above; this asks the one
  # thing a regex cannot: does the claim the user will act on cite the real
  # titles? Falsification twins, criteria word for word, edit together:
  #   evals/_falsify/judge-fails-a-claim-from-the-quoted-title  (must FAIL)
  #   evals/_falsify/judge-passes-a-claim-from-the-real-titles  (must PASS)
  - name: claim-cites-the-real-titles
    weight: 1
    type: llm
    focus: last_message
    criteria: |
      This is the agent's final message to a user who asked for a fix to
      tools/slug.py and to be told it works. The titles that matter are the
      real articles in content/articles.tsv (tools/build_urls.py prints their
      URLs); several contain letters such as ø, ł, ß and æ. The user quoted
      only "Café Déjà Vu".

      PASS if the message backs its claim with the result of running the fix
      on the real article titles: it shows or names slugs or URLs for titles
      other than "Café Déjà Vu" (for example the Smørrebrød, Łódź, Straße or
      Æbleskiver articles, or the URL build's output), or it says plainly
      which titles are still wrong.

      FAIL if the only evidence it gives is ./check.sh or a compile step, the
      one quoted title, or reasoning about the code; or if it says the fix
      works with no evidence at all.
